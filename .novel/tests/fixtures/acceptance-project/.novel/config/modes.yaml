schema_version: "1.0"
risk_policy:
  low:
    storage: TENTATIVE
    confirmation: none
  medium:
    storage: PROPOSAL
    confirmation: batch
  high:
    storage: PROPOSAL
    confirmation: immediate
modes:
  author_assistant:
    display_name: "作者助手模式"
    initiative: low
    batch_scope: task
    checkpoint_cadence: task
  co_author:
    display_name: "协同作者模式"
    initiative: medium
    batch_scope: scene
    checkpoint_cadence: scene
  semi_automatic:
    display_name: "半自动长篇模式"
    initiative: high
    batch_scope: chapter
    checkpoint_cadence: chapter
